<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vorbereitung – LMS Box</title>
    <!-- Vorbereitungsseite für Lehrpersonen (backend/CONTRACT.md, «Teacher materials»). Liest
         teacherMaterials nur mit role == "teacher", speichert nichts, ruft kein Sprachmodell. -->
    <link rel="stylesheet" href="css/vorbereitung.css">
</head>

<body>
    <header class="vb-top">
        <h1>Unterricht vorbereiten</h1>
        <span id="vb-account" class="vb-account"></span>
    </header>

    <!-- Zugang: Gast oder Konto ohne Lehrpersonen-Rolle -->
    <section id="vb-gate" class="vb-card" hidden>
        <h2>Nur mit Lehrpersonen-Konto</h2>
        <p>Diese Seite ist nur mit einem Lehrpersonen-Konto zugänglich. Sie enthält Musterlösungen, Karten und die
            Vollfassung des Hefts.</p>
        <p id="vb-gate-who" class="vb-muted" hidden></p>
        <button id="vb-gate-logout" type="button" hidden>Abmelden</button>
        <form id="vb-login" autocomplete="on">
            <label>Benutzername oder E-Mail
                <input type="text" id="vb-username" autocomplete="username" required>
            </label>
            <label>Passwort
                <input type="password" id="vb-password" autocomplete="current-password" required>
            </label>
            <button id="vb-login-btn" type="submit">Anmelden</button>
            <p id="vb-login-status" class="vb-error" role="status" aria-live="polite"></p>
        </form>
    </section>

    <p id="vb-wait" class="vb-muted">Anmeldung wird geprüft …</p>

    <!-- Lehrperson -->
    <main id="vb-app" hidden>
        <form id="vb-form" class="vb-card vb-form">
            <label>Einheit
                <select id="vb-einheit"></select>
            </label>
            <fieldset>
                <legend>Klasse</legend>
                <label class="vb-inline"><input type="radio" name="vb-klasse" value="3J"> 3J</label>
                <label class="vb-inline"><input type="radio" name="vb-klasse" value="4J" checked> 4J</label>
            </fieldset>
            <label>Datum (erste Lektion)
                <input type="date" id="vb-datum">
            </label>
            <label>Lektionen à 45 min
                <input type="number" id="vb-lektionen" min="1" max="20" step="1" value="2">
            </label>
            <label>Variante
                <select id="vb-variante"></select>
            </label>
        </form>
        <p id="vb-load-status" class="vb-muted" role="status" aria-live="polite"></p>

        <section id="vb-plan" class="vb-card" aria-labelledby="vb-plan-h"></section>
        <section id="vb-links" class="vb-card"></section>
        <section id="vb-handout-card" class="vb-card">
            <div class="vb-row">
                <h2>Handout</h2>
                <button id="vb-print" type="button">Handout drucken</button>
            </div>
            <div id="vb-handout"></div>
        </section>
        <section id="vb-voll" class="vb-card"></section>
    </main>

    <script src="js/vorbereitung.js" type="module"></script>
</body>

</html>
