<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>Aufgabe</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- In an iframe (Obsidian callout): no card of its own, see css/styles.css. Set before the first paint. -->
    <script>if (window.parent !== window) document.documentElement.classList.add('embedded');</script>
    <!-- Heft look (abu-hko-zürich): only when embedded on zh.abu-hko.ch, or with ?look=heft for
         local tests. Other host sites (lehrmittel.aburossi.ch) keep the look below unchanged.
         The parent's origin: location.ancestorOrigins (Chrome, Safari), else the referrer (Firefox). -->
    <script>(function () {
        if (window.parent === window) return;
        var parent = '';
        try {
            if (location.ancestorOrigins && location.ancestorOrigins.length) parent = location.ancestorOrigins[0];
            else if (document.referrer) parent = new URL(document.referrer).origin;
        } catch (e) { /* no parent origin */ }
        var forced = /[?&]look=heft(&|$)/.test(location.search);
        if (parent === 'https://zh.abu-hko.ch' || forced) document.documentElement.classList.add('heft');
    })();</script>
</head>

<body>
    <div id="assignment-container">
        <header id="assignment-header">
            <h2 id="main-title">Lade Aufgabe...</h2>
            <h3 id="sub-title"></h3>
        </header>

        <main id="content-renderer"></main>

        <div id="action-container" style="margin-top: 10px;">
            <button id="print-answers">PDF 🖨</button>
            <span id="save-status" role="status" aria-live="polite" style="font-size: 0.85em;"></span>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="js/app.js" type="module"></script>
</body>

</html>
