<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Rückmeldungen</title>
    <!-- Alle formativ-Rückmeldungen der LMS Boxen einer Seite auf lehrmittel.aburossi.ch
         (backend/CONTRACT.md, «Formative feedback: attempts, trail, overview»). publish.js
         öffnet diese Seite in einem Seitenfenster und gibt nur die Ids der Boxen mit. -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        html, body { margin: 0; padding: 0; background: #fff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.5; color: #212529; }
        #rm { padding: 12px 16px 32px; }
        .rm-state { color: #6c757d; font-size: 0.95em; }
        .rm-state a { color: #0d6efd; cursor: pointer; }
        .rm-summary { margin: 0 0 14px; padding: 10px 12px; border: 1px solid #dee2e6; border-radius: 8px; background: #f8f9fa; }
        .rm-summary h2 { margin: 0 0 6px; font-size: 0.95em; font-weight: 600; }
        .rm-legend { margin: 6px 0 0; font-size: 0.8em; color: #6c757d; }
        .rm-section { margin: 18px 0 0; }
        .rm-section > h3 { margin: 0 0 6px; font-size: 1em; font-weight: 650; border-bottom: 1px solid #e9ecef; padding-bottom: 3px; }
        .rm-q { margin: 8px 0 12px; padding: 8px 10px; border: 1px solid #e9ecef; border-radius: 8px; }
        .rm-q-head { display: flex; align-items: baseline; gap: 8px; }
        .rm-q-text { flex: 1; min-width: 0; font-size: 0.9em; color: #343a40; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .rm-goto { flex: none; font: inherit; font-size: 0.8em; padding: 1px 8px; border: 1px solid #ced4da; border-radius: 999px; background: #fff; color: #0d6efd; cursor: pointer; }
        .rm-goto:hover { background: #e7f1ff; }
        .rm-goto:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
        .rm-none { font-size: 0.85em; color: #6c757d; margin: 4px 0 0; }
        .rm-q .formativ-panel { margin-top: 6px; }
        .rm-foot { margin-top: 18px; font-size: 0.78em; color: #6c757d; }
    </style>
</head>

<body>
    <main id="rm" aria-live="polite">
        <p class="rm-state">Rückmeldungen werden geladen …</p>
    </main>
    <script src="js/rueckmeldungen.js" type="module"></script>
</body>

</html>
